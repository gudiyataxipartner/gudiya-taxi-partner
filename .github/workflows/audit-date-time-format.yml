name: Audit User Duty Date Time Inputs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-date-time-format.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect duty date and time
        run: |
          unzip -oq Gudiya-Taxi-Partner-New-Project.zip -d app-source
          python3 tools/audit-duty-date-time.py
