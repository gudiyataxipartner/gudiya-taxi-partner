name: Audit BharatPe Payment Patch Anchors
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-payment-patch-anchors.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count exact payment patch source anchors
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq Gudiya-Taxi-Partner-New-Project.zip -d app-source
          python3 - <<'PY'
          from pathlib import Path
          s=(Path("app-source/GudiyaTaxiPartner/app/src/main/assets/index.html")).read_text(encoding="utf-8")
          checks={
          "home copy":"सदस्यता प्लान उपलब्ध हैं। भुगतान सुविधा पर अभी काम चल रहा है। नया भुगतान विकल्प शुरू होने तक कोई भुगतान नहीं होगा और सदस्यता अपने-आप सक्रिय नहीं होगी।",
          "home notice":"भुगतान विकल्प जल्द उपलब्ध होगा।",
          "UPI guard":"let selectedUpiPlan=1;function startUpiPayment(months=1){if(!getToken())",
          "submit suffix":"document.getElementById('upiUtr').value='';}catch(e){box.className='warn';box.textContent='जमा नहीं हुआ: '+e.message;",
          "refresh function":"async function refreshMembership(){if(!getToken()||!apiReady())return;try{const d=await apiRequest('/api/membership');const box=document.getElementById('paymentMessage');if(box){box.className=d.active?'success':'warn';box.textContent=d.active?('आपकी '+(d.subscription?.amount_rupees||'चुनी गई')+' रुपये की सदस्यता सक्रिय है।'):('सदस्यता सक्रिय नहीं है। स्थिति: '+(d.subscription?.status||'शुरू नहीं हुई')+'.')} }catch(e){}}",
          }
          for name,needle in checks.items():
              print(name, "count=",s.count(needle))
              if name=="submit suffix":
                  p=s.find("async function submitUpiPayment")
                  print("submit func:",s[p:p+1600])
          PY
