name: Inspect Gudiya User App Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract app source and inspect navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app-source
          unzip -oq Gudiya-Taxi-Partner-New-Project.zip -d app-source
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("app-source/GudiyaTaxiPartner")
          print("=== SOURCE FILES ===")
          for p in sorted((root/"app/src/main").rglob("*")):
              if p.is_file():
                  print(p.relative_to(root))
          html=(root/"app/src/main/assets/index.html").read_text(encoding="utf-8")
          for source_name in ("MainActivity.kt","MainActivity.java"):
              source=(root/"app/src/main/java/com/gudiyataxipartner"/source_name).read_text(encoding="utf-8")
              print("\\n=== "+source_name+" ===")
              print(source[:18000])
          print("\\n=== HTML NAV SELECTOR AND MARKUP ===")
          for token in (".nav", "data-page", "bottom-nav", "position:fixed", "class=\\\"nav"):
              indexes=[m.start() for m in re.finditer(re.escape(token),html,re.I)]
              for pos in indexes[:6]:
                  print("\\n--- "+token+" ---")
                  print(html[max(0,pos-400):min(len(html),pos+900)])
          print("\\n=== NAVIGATION / SCREEN HTML ===")
          for token in ("Home", "होम", "ड्यूटी खोजें", "Duty Search", "ड्यूटी पोस्ट", "My Duty", "मेरी ड्यूटी", "Available Vehicles"):
              positions=[m.start() for m in re.finditer(re.escape(token),html,re.I)]
              for pos in positions[:4]:
                  print("\\n--- " + token + " ---")
                  print(html[max(0,pos-500):min(len(html),pos+900)])
          for marker in ("function show(", "async function renderMine", "async function postDuty", "async function apiRequest", "function switchTab"):
              i=html.find(marker)
              if i>=0:
                  print("\\n=== CONTEXT "+marker+" ===")
                  print(html[max(0,i-300):min(len(html),i+1800)])
          print("\\n=== DUTY STATUS / BOOKED UI REFERENCES ===")
          for pattern in (r"booked",r"book",r"status.{0,40}(open|accepted|completed)",r"(open|accepted|completed).{0,40}status",r"dutyDate",r"duty_date",r"renderMine",r"myDuties",r"mine"):
              positions=[m.start() for m in re.finditer(pattern,html,re.I)]
              print("PATTERN",pattern,"COUNT",len(positions))
              for pos in positions[:12]:
                  print("\\n--- "+pattern+" ---")
                  print(html[max(0,pos-500):min(len(html),pos+1400)])
          print("\\n=== DUTY-RELATED FUNCTION DECLARATIONS ===")
          for m in re.finditer(r"(?:async\\s+)?function\\s+[A-Za-z_$][\\w$]*[^\\n]*",html):
              if re.search(r"duty|book|mine|status",m.group(0),re.I):
                  pos=m.start()
                  print("\\n--- FUNCTION ---")
                  print(html[pos:min(len(html),pos+2600)])
          print("\\n=== MAIN ACTIVITY NAVIGATION HOOKS ===")
          for source_name in ("MainActivity.kt","MainActivity.java"):
              source=(root/"app/src/main/java/com/gudiyataxipartner"/source_name).read_text(encoding="utf-8")
              for token in ("BottomNavigationView","setContentView","addJavascriptInterface","loadUrl","nav"):
                  pos=source.find(token)
                  if pos>=0:
                      print(source[max(0,pos-250):min(len(source),pos+600)])
          PY
