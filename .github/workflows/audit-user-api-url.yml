name: Audit User App API URL
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-user-api-url.yml"
      - "tools/audit-user-api-url.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and print API configuration
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq Gudiya-Taxi-Partner-New-Project.zip -d app-source
          python3 tools/audit-user-api-url.py
