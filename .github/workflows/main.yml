name: Build and publish Gudiya Taxi Partner APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Gudiya-Taxi-Partner-New-Project.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and validate app source
        run: | set -euo pipefail test -s Gudiya-Taxi-Partner-New-Project.zip rm -rf app-source unzip -oq Gudiya-Taxi-Partner-New-Project.zip -d app-source test -f app-source/GudiyaTaxiPartner/settings.gradle.kts test -f app-source/GudiyaTaxiPartner/app/build.gradle.kts test -f app-source/GudiyaTaxiPartner/app/src/main/assets/index.html 
      - name: Build APK
        working-directory: app-source/GudiyaTaxiPartner
        run: gradle assembleDebug

      - name: Verify APK
        run: | set -euo pipefail test -s app-source/GudiyaTaxiPartner/app/build/outputs/apk/debug/app-debug.apk cp app-source/GudiyaTaxiPartner/app/build/outputs/apk/debug/app-debug.apk gudiya-taxi-partner.apk test -s gudiya-taxi-partner.apk 
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gudiya-taxi-partner-apk
          path: gudiya-taxi-partner.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Gudiya Taxi Partner APK
          body: | Latest Android APK for Gudiya Taxi Partner. Download gudiya-taxi-partner.apk to install the app.           target_commitish: main
          files: gudiya-taxi-partner.apk
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false
