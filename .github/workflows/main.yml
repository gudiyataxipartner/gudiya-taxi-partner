name: Build and publish Gudiya Taxi Partner APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Gudiya-Taxi-Partner-New-Project.zip"
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract app source
        run: unzip -o Gudiya-Taxi-Partner-New-Project.zip -d app-source
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: app-source/GudiyaTaxiPartner
        run: gradle assembleDebug
      - name: Verify APK
        run: test -s app-source/GudiyaTaxiPartner/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: | gh release view latest >/dev/null 2>&1 || gh release create latest --title "Gudiya Taxi Partner APK" --notes "Latest APK download for Gudiya Taxi Partner." --latest gh release upload latest app-source/GudiyaTaxiPartner/app/build/outputs/apk/debug/app-debug.apk#app-debug.apk --clobber gh release edit latest --title "Gudiya Taxi Partner APK" --notes "Latest APK download for Gudiya Taxi Partner." --latest
