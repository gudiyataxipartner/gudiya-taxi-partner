          content = content.replace(card_anchor, date_time_helpers + "\n" + card_anchor, 1)

          old_post_inputs = "const date=document.getElementById('date').value,time=document.getElementById('time')?.value||'';if(!date||!time){alert('कृपया ड्यूटी की तारीख और समय दोनों चुनें।');return}"
          new_post_inputs = "const dateInput=document.getElementById('date').value,timeInput=updateDutyTimeValue(),date=parseDutyDateInput(dateInput),time=parseDutyTimeInput(timeInput);if(!date||!time){alert('कृपया कैलेंडर से ड्यूटी की तारीख चुनें और समय में HH, MM तथा AM/PM चुनें।');return}"
          if content.count(old_post_inputs) != 1:
              raise SystemExit("Duty post date/time validation target missing; refusing to build.")
          content = content.replace(old_post_inputs, new_post_inputs, 1)

          old_edit_values = "document.getElementById('date').value=String(duty.dutyDate||duty.duty_date||'').slice(0,10);document.getElementById('time').value=String(duty.dutyTime||duty.duty_time||'').slice(0,5);"
          new_edit_values = "document.getElementById('date').value=String(duty.dutyDate||duty.duty_date||'').slice(0,10);setDutyTimePicker(duty.dutyTime||duty.duty_time||'');"
          if content.count(old_edit_values) != 1:
              raise SystemExit("Duty edit date/time target missing; refusing to build.")
          content = content.replace(old_edit_values, new_edit_values, 1)

          old_reset = "['from','to','date','time','payout','notes'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''})"
          new_reset = "['from','to','date','time','payout','notes','timeHour','timeMinute','timeAmPm'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''})"
          if content.count(old_reset) != 1:
              raise SystemExit("Duty form reset target missing; refusing to build.")
          content = content.replace(old_reset, new_reset, 1)

          old_card_date = "$" + "{esc(d.dutyDate||d.duty_date||'तारीख तय नहीं')}"
          new_card_date = "$" + "{esc(formatDutyDate(d.dutyDate||d.duty_date||''))}"
          old_card_time = "$" + "{esc(d.dutyTime||d.duty_time||d.time||'समय तय नहीं')}"
          new_card_time = "$" + "{esc(formatDutyTime(d.dutyTime||d.duty_time||d.time||''))}"
          for old, new, label in (
              (old_card_date, new_card_date, "duty card date"),
              (old_card_time, new_card_time, "duty card time"),
          ):
              if content.count(old) != 1:
                  raise SystemExit("Expected exactly one " + label + " display; refusing to build.")
              content = content.replace(old, new, 1)

          old_share_date_time = "date=d.dutyDate||d.duty_date||'तारीख तय नहीं',time=d.dutyTime||d.duty_time||d.time||'समय तय नहीं'"
          new_share_date_time = "date=formatDutyDate(d.dutyDate||d.duty_date||''),time=formatDutyTime(d.dutyTime||d.duty_time||d.time||'')"
          if content.count(old_share_date_time) != 1:
              raise SystemExit("Duty WhatsApp share date/time target missing; refusing to build.")
          content = content.replace(old_share_date_time, new_share_date_time, 1)

          if 'id="date" type="date" required' not in content or 'id="time" type="hidden"' not in content:
              raise SystemExit("Native calendar or hidden API time field is missing.")
          if 'id="timeHour"' not in content or 'id="timeMinute"' not in content or 'id="timeAmPm"' not in content:
              raise SystemExit("Selectable 12-hour time controls are missing.")
          if "dutyDate:date,dutyTime:time" not in content:
              raise SystemExit("Existing API duty date/time fields were changed unexpectedly.")

          # Mandatory update gate. It is checked on every app start against the
          # minimum supported version in the latest published GitHub release.
          update_gate = r"""<style>
          #gudiyaUpdateGate{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:24px;background:#eef4fa;color:#17324a;font-family:Arial,sans-serif}
          #gudiyaUpdateGate .gudiya-update-card{width:100%;max-width:460px;background:#fff;border:1px solid #dce6ed;border-radius:24px;padding:28px 22px;box-shadow:0 12px 36px rgba(20,48,70,.12);text-align:center}
          #gudiyaUpdateGate .gudiya-update-icon{font-size:54px;margin-bottom:10px}
          #gudiyaUpdateGate h2{font-size:25px;margin:8px 0 12px;color:#17324a}
          #gudiyaUpdateGate p{font-size:16px;line-height:1.55;color:#526675}
          #gudiyaUpdateGate .gudiya-update-version{display:inline-block;background:#e8f5f2;color:#087f70;border-radius:12px;padding:9px 14px;font-weight:800;margin:12px 0}
          #gudiyaUpdateGate .gudiya-update-button{display:block;width:100%;border:0;border-radius:14px;background:#078f7d;color:#fff;text-decoration:none;font-size:18px;font-weight:800;padding:16px 12px;margin-top:16px;box-sizing:border-box}
          #gudiyaUpdateGate .gudiya-update-note{font-size:13px;color:#71808c;margin-top:14px}
          </style>
          <div id="gudiyaUpdateGate" role="dialog" aria-modal="true" aria-labelledby="gudiyaUpdateTitle">
           <div class="gudiya-update-card">
            <div class="gudiya-update-icon">🚖</div>
            <h2 id="gudiyaUpdateTitle">अपडेट जाँची जा रही है</h2>
            <p id="gudiyaUpdateMessage">आपके Gudiya Taxi Partner ऐप का नवीनतम Version जाँचा जा रहा है।</p>
            <div id="gudiyaUpdateVersion" class="gudiya-update-version" hidden></div>
            <a id="gudiyaUpdateButton" class="gudiya-update-button" href="#" hidden>⬇ अभी नया अपडेट डाउनलोड करें</a>
            <div id="gudiyaUpdateNote" class="gudiya-update-note">अपडेट पूरा होने के बाद ऐप दोबारा खोलें।</div>
           </div>
          </div>
          <script>
          (function(){
           const layer=document.getElementById('gudiyaUpdateGate');
           const message=document.getElementById('gudiyaUpdateMessage');
           const title=document.getElementById('gudiyaUpdateTitle');
           const versionBox=document.getElementById('gudiyaUpdateVersion');
           const button=document.getElementById('gudiyaUpdateButton');
           const note=document.getElementById('gudiyaUpdateNote');
           const appVersion=String(window.GUDIYA_APP_VERSION||'').trim();
           const rawApiBase=String(window.GUDIYA_API_BASE||'').trim();
           const apiBase=rawApiBase.endsWith('/')?rawApiBase.slice(0,-1):rawApiBase;
           function versionParts(value){
            const parts=String(value||'').trim().split('.');
            if(parts.length<2||parts.length>4||parts.some(part=>part===''||!Number.isSafeInteger(Number(part))||Number(part)<0))return null;
            return parts.map(part=>Number(part));
           }
           function compareVersions(a,b){
            const aa=versionParts(a),bb=versionParts(b);
            if(!aa||!bb)return null;
            for(let i=0;i<Math.max(aa.length,bb.length);i++){
             const x=aa[i]||0,y=bb[i]||0;
             if(x<y)return -1;
             if(x>y)return 1;
            }
            return 0;
           }
           async function check(){
            if(!appVersion||!apiBase.startsWith('https://')){layer.remove();return;}
            try{
             const controller=new AbortController();
             const timeout=window.setTimeout(()=>controller.abort(),8000);
             let response;
             try{
              response=await fetch(apiBase+'/api/app-version',{method:'GET',cache:'no-store',headers:{Accept:'application/json'},signal:controller.signal});
             }finally{window.clearTimeout(timeout);}
             if(!response.ok)throw new Error('Update check unavailable');
             const info=await response.json();
             const minimum=String(info.minimumSupportedVersion||'').trim();
             const comparison=compareVersions(appVersion,minimum);
             if(comparison===null)throw new Error('Invalid app version metadata');
             if(comparison>=0){layer.remove();return;}
             const apkUrl=String(info.apkUrl||'').trim();
             if(!apkUrl.startsWith('https://'))throw new Error('APK download link unavailable');
             layer.style.display='flex';
             layer.setAttribute('aria-hidden','false');
             title.textContent='नया अपडेट अनिवार्य है';
             message.textContent='आपका ऐप Version '+appVersion+' पुराना हो चुका है। आगे काम जारी रखने के लिए नया Version इंस्टॉल करें।';
             versionBox.textContent='नया Version: '+String(info.latestVersion||minimum);
             versionBox.hidden=false;
             button.href=apkUrl;
             button.hidden=false;
             button.addEventListener('click',function(){
              message.textContent='नया APK डाउनलोड हो रहा है। डाउनलोड पूरा होने पर फ़ाइल खोलकर Update इंस्टॉल करें।';
             });
             note.textContent='अपडेट इंस्टॉल होने तक ऐप के बाकी सभी फीचर लॉक रहेंगे। ऐप uninstall न करें।';
            }catch(error){
             console.warn('Gudiya app update check skipped:',error);
             layer.remove();
            }
           }
           check();
          })();
          </script>
          """
          if "</body>" not in content or content.count("</body>") != 1:
              raise SystemExit("App body closing tag missing or duplicated; refusing to add update gate.")
          if "gudiyaUpdateGate" in content:
              raise SystemExit("Mandatory update gate already exists in source; refusing duplicate insertion.")
          content = content.replace("</body>", update_gate + chr(10) + "</body>", 1)
          html.write_text(content, encoding="utf-8")
          print("Mandatory update gate added; temporary version-check failures do not lock the app.")

          gradle = root / "app/build.gradle.kts"
          build = gradle.read_text(encoding="utf-8")
          build, c1 = re.subn(r"versionCode\s*=\s*\d+", "versionCode = 30", build, count=1)
          build, c2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.3.8"', build, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("Could not safely increment Android app version.")
          old_types = """    buildTypes {
                  getByName("debug") {
                      // Keep the same stable signing identity for every APK distributed from GitHub.
                      signingConfig = signingConfigs.getByName("stableRelease")
                  }
              }"""
          new_types = """    buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("stableRelease")
                  }
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("stableRelease")
                      isMinifyEnabled = false
                  }
              }"""
          if 'getByName("release")' not in build:
              build, build_types_count = re.subn(
                  r'    buildTypes\\s*\\{\\s*getByName\\("debug"\\)\\s*\\{[\\s\\S]*?\\}\\s*\\}',
                  new_types,
                  build,
                  count=1,
              )
              if build_types_count != 1:
                  raise SystemExit("Stable User App buildTypes block could not be safely updated.")
          if 'getByName("release")' in build and 'signingConfig = signingConfigs.getByName("stableRelease")' not in build:
              raise SystemExit("Release signing configuration is not using the stable key.")
          gradle.write_text(build, encoding="utf-8")

          # Embed this exact APK version in the WebView config so the app can
          # compare itself with the backend's minimum supported version.
          config_js = root / "app/src/main/assets/config.js"
          if not config_js.is_file():
              raise SystemExit("Android app config.js missing; refusing to build.")
          config_content = config_js.read_text(encoding="utf-8")
          app_version_line = "window.GUDIYA_APP_VERSION = '1.3.8';"
          if "window.GUDIYA_APP_VERSION" in config_content:
              config_lines = [line for line in config_content.splitlines() if not line.strip().startswith("window.GUDIYA_APP_VERSION")]
              config_content = chr(10).join(config_lines).rstrip() + chr(10) + app_version_line + chr(10)
          else:
              config_content = config_content.rstrip() + chr(10) + app_version_line + chr(10)
          config_js.write_text(config_content, encoding="utf-8")
          PY
          # Fail the APK build if any inline WebView JavaScript is syntactically invalid.
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app-source/GudiyaTaxiPartner/app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.S|re.I)
          Path("/tmp/gudiya-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/gudiya-inline.js
          grep -Fq "gudiyaUpdateGate" app-source/GudiyaTaxiPartner/app/src/main/assets/index.html
          grep -Fq "BharatPe UPI से भुगतान किया जा सकता है" app-source/GudiyaTaxiPartner/app/src/main/assets/index.html
          if grep -Fq "भुगतान सुविधा पर अभी काम चल रहा है" app-source/GudiyaTaxiPartner/app/src/main/assets/index.html; then echo "Stale membership payment text remains"; exit 1; fi
          grep -Fq "window.GUDIYA_APP_VERSION = '1.3.8';" app-source/GudiyaTaxiPartner/app/src/main/assets/config.js
          grep -Fq "display:none" app-source/GudiyaTaxiPartner/app/src/main/assets/index.html
          grep -Fq "layer.style.display='flex'" app-source/GudiyaTaxiPartner/app/src/main/assets/index.html
          grep -Fq "window.GUDIYA_APP_VERSION = '1.3.8';" app-source/GudiyaTaxiPartner/app/src/main/assets/config.js

      - name: Prepare stable signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing repository secret ANDROID_KEYSTORE_BASE64"; exit 1)
          mkdir -p app-source/GudiyaTaxiPartner/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app-source/GudiyaTaxiPartner/app/gudiya-release.jks
          test -s app-source/GudiyaTaxiPartner/app/gudiya-release.jks

      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app-source/GudiyaTaxiPartner/app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build APK with stable signing key
        working-directory: app-source/GudiyaTaxiPartner
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing repository secret ANDROID_KEYSTORE_PASSWORD"; exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing repository secret ANDROID_KEY_PASSWORD"; exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing repository secret ANDROID_KEY_ALIAS"; exit 1)
          gradle assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app-source/GudiyaTaxiPartner/app/build/outputs/apk/release/app-release.apk
          cp app-source/GudiyaTaxiPartner/app/build/outputs/apk/release/app-release.apk gudiya-taxi-partner.apk
          test -s gudiya-taxi-partner.apk

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT" || (echo "Missing aapt"; exit 1)
          test -n "$APKSIGNER" || (echo "Missing apksigner"; exit 1)
          BADGING="$("$AAPT" dump badging gudiya-taxi-partner.apk)"
          echo "$BADGING" | grep -F "package: name='com.gudiyataxipartner' versionCode='30' versionName='1.3.8'" >/dev/null || {
            echo "ERROR: User APK package/version metadata mismatch."
            echo "$BADGING" | head -5
            exit 1
          }
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "ERROR: Production User APK is still debuggable."
            exit 1
          fi
          "$APKSIGNER" verify gudiya-taxi-partner.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gudiya-taxi-partner-apk
          path: gudiya-taxi-partner.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Gudiya Taxi Partner APK
          body: |
            Latest Android APK for Gudiya Taxi Partner.
            Version: ${{ env.VERSION_NAME }}
            Minimum supported version: ${{ env.VERSION_NAME }}
            Download gudiya-taxi-partner.apk to install or update the app.
          target_commitish: main
          files: gudiya-taxi-partner.apk
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false
