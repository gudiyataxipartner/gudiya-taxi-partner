name: Build and publish Gudiya Taxi Partner APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Gudiya-Taxi-Partner-New-Project.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and validate app source
        shell: bash
        run: |
          set -euo pipefail
          test -s Gudiya-Taxi-Partner-New-Project.zip
          rm -rf app-source
          unzip -oq Gudiya-Taxi-Partner-New-Project.zip -d app-source
          test -f app-source/GudiyaTaxiPartner/settings.gradle.kts
          test -f app-source/GudiyaTaxiPartner/app/build.gradle.kts
          test -f app-source/GudiyaTaxiPartner/app/src/main/assets/index.html

      - name: Fix WhatsApp duty contact display and bump app version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app-source/GudiyaTaxiPartner")
          html = root / "app/src/main/assets/index.html"
          content = html.read_text(encoding="utf-8")
          pattern = r"const contact=.*?;const share="
          replacement = r'''const contact=isOwner?`<div class="success duty-contact" style="margin-top:10px">✅ यह आपकी पोस्ट की गई ड्यूटी है। आप पर 5 मिनट का लॉक लागू नहीं है।</div>`:!available?`<div class="row duty-contact" style="margin-top:10px"><button class="btn teal" disabled>🔒 5 मिनट बाद कॉल</button><button class="btn" disabled>🔒 5 मिनट बाद WhatsApp</button></div>`:phone?`<div class="row duty-contact" style="margin-top:10px"><button class="btn teal" onclick="callPoster('${esc(id)}')">📞 कॉल करें</button><button class="btn" onclick="openPosterWhatsApp('${esc(id)}')">🟢 ड्यूटी की जानकारी WhatsApp करें</button></div>`:`<div class="notice duty-contact" style="margin-top:10px">✅ 5 मिनट पूरे हो चुके हैं, लेकिन इस ड्यूटी के संदेश में संपर्क मोबाइल नंबर उपलब्ध नहीं है।</div>`;const share='''
          content, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Duty contact UI patch target was not found; refusing to build.")
          html.write_text(content, encoding="utf-8")

          # Restore the missing Accept action and make it available only to
          # eligible driver accounts for open duties whose details are unlocked.
          fixes = [
              (
                  "canAccept=!!getToken()&&apiReady()&&d.status==='open'&&/^\\d+$/.test(id),phone=",
                  "canAccept=!!getToken()&&apiReady()&&['driver','both'].includes(currentUser?.roleMode||currentUser?.role_mode)&&!isOwner&&!d.acceptedByMe&&d.status==='open'&&available&&/^\\d+$/.test(id),phone=",
              ),
              (
                  ";const share=`<button class=\"btn outline\"",
                  ";const accept=canAccept?'<button class=\"btn teal\" style=\"margin-top:10px\" onclick=\"acceptDuty(\\''+esc(id)+'\\',this)\">✅ ड्यूटी स्वीकार करें</button>':'';const share=`<button class=\"btn outline\"",
              ),
              ("${contact}${share}", "${contact}${accept}${share}"),
              (
                  '<select id="qvehicle"><option value="">सभी गाड़ियाँ</option><option>सेडान</option><option>हैचबैक</option><option>एसयूवी</option><option>इनोवा / क्रिस्टा</option><option>टेम्पो ट्रैवलर</option><option>अन्य</option></select>',
                  '<select id="qvehicle"><option value="">सभी गाड़ियाँ</option><option value="sedan">सेडान</option><option value="hatchback">हैचबैक</option><option value="suv">एसयूवी</option><option value="innova">इनोवा / क्रिस्टा</option><option value="ertiga">Ertiga</option><option value="dzire">Dzire</option><option value="tempo">टेम्पो ट्रैवलर</option><option value="other">अन्य</option></select>',
              ),
              (
                  "function filterDutyResults(list){const date=document.getElementById('qdate')?.value||'',vehicle=document.getElementById('qvehicle')?.value||'';return list.filter(d=>{const dd=d.dutyDate||d.duty_date||'',vv=d.vehicleType||d.vehicle_type||'';return (!date||String(dd).slice(0,10)===date)&&(!vehicle||String(vv).toLowerCase()===vehicle.toLowerCase())})}",
                  "function filterDutyResults(list){const date=document.getElementById('qdate')?.value||'',vehicle=document.getElementById('qvehicle')?.value||'';const patterns={sedan:/(sedan|सेडान|dzire|swift)/i,hatchback:/(hatchback|हैचबैक)/i,suv:/(suv|एसयूवी|xylo|tavera|ertiga)/i,innova:/(innova|इनोवा)/i,ertiga:/(ertiga|अर्टिगा)/i,dzire:/(dzire|swift|डिजायर)/i,tempo:/(tempo|traveller|टेम्पो)/i,other:/^(अन्य|other)$/i};return list.filter(d=>{const dd=d.dutyDate||d.duty_date||'',vv=String(d.vehicleType||d.vehicle_type||'');return (!date||String(dd).slice(0,10)===date)&&(!vehicle||(patterns[vehicle]?patterns[vehicle].test(vv):true))})}",
              ),
              (
                  "const q=new URLSearchParams();if(from)q.set('pickup',from);if(to)q.set('drop',to);const data=await apiRequest('/api/duties?'+q.toString());",
                  "const q=new URLSearchParams();if(from)q.set('pickup',from);if(to)q.set('drop',to);const date=document.getElementById('qdate')?.value||'',vehicle=document.getElementById('qvehicle')?.value||'';if(date)q.set('date',date);if(vehicle)q.set('vehicle',vehicle);const data=await apiRequest('/api/duties?'+q.toString());",
              ),
              (
                  "}catch(serverError){if(editingDutyId){alert(serverError.message||'ड्यूटी अपडेट नहीं हो सकी।');return}saveLocalDuty(duty);resetDutyForm();alert('सर्वर से सेव नहीं हो पाई, इसलिए ड्यूटी इस फोन में डेमो के रूप में सेव कर दी गई है। इंटरनेट/सर्वर ठीक होने पर इसे दोबारा पोस्ट करें।');show('myduties');return}",
                  "}catch(serverError){alert((editingDutyId?'ड्यूटी अपडेट नहीं हो सकी: ':'ड्यूटी सर्वर पर पोस्ट नहीं हुई: ')+(serverError.message||'कृपया इंटरनेट/API जाँचकर फिर प्रयास करें।')+' आपके भरे हुए विवरण फॉर्म में सुरक्षित हैं।');return}",
              ),
              (
                  "async function refreshMembership(){if(!getToken()||!apiReady())return;try{const d=await apiRequest('/api/membership');const box=document.getElementById('paymentMessage');if(box){box.className=d.active?'success':'warn';box.textContent=d.active?('आपकी '+(d.subscription?.amount_rupees||'चुनी गई')+' रुपये की सदस्यता सक्रिय है।'):('सदस्यता सक्रिय नहीं है। स्थिति: '+(d.subscription?.status||'शुरू नहीं हुई')+'.')} }catch(e){}}",
                  "async function refreshMembership(){if(!getToken()||!apiReady())return;const box=document.getElementById('paymentMessage');try{const d=await apiRequest('/api/membership');if(box){box.className=d.active?'success':'warn';box.textContent=d.active?('आपकी '+(d.subscription?.amount_rupees||'चुनी गई')+' रुपये की सदस्यता सक्रिय है।'):('सदस्यता सक्रिय नहीं है। स्थिति: '+(d.subscription?.status||'शुरू नहीं हुई')+'.')}}catch(e){if(box){box.className='warn';box.textContent='सदस्यता स्थिति लोड नहीं हुई: '+e.message}}}",
              ),
              (r"""${sourceGroup?`<div class="notice">WhatsApp ग्रुप: <b>${esc(sourceGroup)}</b></div>`:''}""", "''"),
          ]
          for old, new in fixes:
              if old not in content:
                  raise SystemExit('User App audit fix target missing; refusing to build: ' + old[:100])
              content = content.replace(old, new, 1)

          # Never show WhatsApp group metadata in a duty card. Normalize the
          # poster label because Android notification titles can arrive as
          # "Group name (7 messages): ~ Actual sender".
          old_owner = "ownerName=d.sourcePosterName||d.source_poster_name||d.posterName||d.poster_name||''"
          if old_owner not in content:
              raise SystemExit("Poster name rendering target missing; refusing to build.")
          clean_name = r"""function cleanWhatsAppPosterName(value,group){
           let name=String(value||'').trim();
           const groupName=String(group||'').trim();
           if(groupName&&name.toLowerCase().startsWith(groupName.toLowerCase()))name=name.slice(groupName.length).replace(/^\s*(?:\(\s*\d+\s+messages?\s*\))?\s*[:：\-–]\s*/i,'');
           name=name.replace(/^.*?\(\s*\d+\s+messages?\s*\)\s*[:：]\s*/i,'').replace(/^~\s*/,'').split(/\r?\n/)[0].replace(/\s*[·|]\s*\+?\d[\d\s-]{8,}\s*$/,'').trim();
           if(/^\d+\s+messages?$/i.test(name)||/^whatsapp\s*$/i.test(name))return '';
           return name;
          }
          """
          content = content.replace(old_owner, "ownerName=cleanWhatsAppPosterName(d.posterName||d.poster_name||d.sourcePosterName||d.source_poster_name||'',d.sourceGroup||d.source_group||'')", 1)
          card_anchor = "function apiDutyCard(d){"
          if card_anchor not in content:
              raise SystemExit("Duty card insertion point missing for WhatsApp name sanitizer.")
          content = content.replace(card_anchor, clean_name + "\n" + card_anchor, 1)
          # Suppress source-group label even if a future card template adds it.
          group_block = r"\$\{sourceGroup\?`<div class=\"notice\">WhatsApp ग्रुप:[\s\S]*?</div>`:''\}"
          content = re.sub(group_block, "", content, count=1)
          content = content.replace("sourceGroup=d.sourceGroup||d.source_group||'',", "sourceGroup='',", 1)

          # Format any raw ISO timestamp as Indian local date/time.
          card_anchor = "function apiDutyCard(d){"
          formatter = "function formatDutyPostedAt(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return String(value||'');return new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(date)}" + "\n"
          if card_anchor not in content:
              raise SystemExit("Duty card insertion point missing; refusing to build.")
          content = content.replace(card_anchor, formatter + card_anchor, 1)
          old_posted = "${esc(d.createdAt||d.created_at||'')}"
          if old_posted not in content:
              raise SystemExit("Duty posted-at display target missing; refusing to build.")
          content = content.replace(old_posted, "${esc(formatDutyPostedAt(d.createdAt||d.created_at||''))}", 1)

          html.write_text(content, encoding="utf-8")
          # Duty refresh: ignore SSE connection handshakes and refresh only on real duty changes.
          old_sse_handler = "if(event.includes('event: duty-update'))refreshVisibleDutyFeed();"
          new_sse_handler = r"""const eventName=(event.match(/^event:\s*(.+)$/m)||[])[1]||'';
              const dataText=event.split(/\r?\n/).filter(line=>line.startsWith('data:')).map(line=>line.slice(5).trim()).join('\n');
              if(eventName==='duty-update'&&dataText){try{const payload=JSON.parse(dataText);if(payload&&payload.type==='duties-changed')refreshVisibleDutyFeed();}catch(e){}}"""
          if old_sse_handler not in content:
              raise SystemExit("Duty SSE handler target missing; refusing to build.")
          content = content.replace(old_sse_handler, new_sse_handler, 1)

          # Coalesce focus/visibility/SSE callbacks; automatic list refreshes are
          # limited to one every 5 seconds and only while the relevant screen is visible.
          refresh_pattern = r"function refreshVisibleDutyFeed\(\)\{[\s\S]*?\n\}"
          refresh_replacement = r"""function refreshVisibleDutyFeed(){
           if(document.hidden||!getToken()||!apiReady())return;
           const search=document.getElementById('search');
           const mine=document.getElementById('myduties');
           if((!search||search.classList.contains('hidden'))&&(!mine||mine.classList.contains('hidden')))return;
           if(window.__gudiyaDutyFeedRefreshTimer)clearTimeout(window.__gudiyaDutyFeedRefreshTimer);
           const elapsed=Date.now()-(window.__gudiyaLastDutyFeedRefresh||0);
           const wait=Math.max(400,5000-elapsed);
           window.__gudiyaDutyFeedRefreshTimer=setTimeout(()=>{
            window.__gudiyaDutyFeedRefreshTimer=null;
            if(document.hidden||!getToken()||!apiReady())return;
            const currentSearch=document.getElementById('search');
            const currentMine=document.getElementById('myduties');
            if(currentSearch&&!currentSearch.classList.contains('hidden')){
             window.__gudiyaLastDutyFeedRefresh=Date.now();
             renderSearch(true);
            }else if(currentMine&&!currentMine.classList.contains('hidden')){
             window.__gudiyaLastDutyFeedRefresh=Date.now();
             renderMine(true);
            }
           },wait);
          }"""
          content, refresh_count = re.subn(refresh_pattern, lambda match: refresh_replacement, content, count=1)
          if refresh_count != 1:
              raise SystemExit("Duty refresh function target missing; refusing to build.")

          # Quiet background refreshes so the existing My Duties list remains on-screen.
          # Prevent overlapping requests and run one coalesced follow-up when needed.
          mine_pattern = r"async function renderMine\(\)\{[\s\S]*?\}\nfunction resetDutyForm"
          mine_replacement = r"""async function renderMine(silent=false){
           const box=document.getElementById('myDutyList');
           if(!getToken()||!apiReady()){
            const local=getLocalDuties();
            box.innerHTML=local.length?local.map(d=>apiDutyCard({...d,isOwner:true,detailsAvailable:true,freeWindowSecondsRemaining:null})).join(''):'<div class="card empty">इस फोन पर अभी कोई ड्यूटी सेव नहीं है।</div>';
            return;
           }
           if(window.__gudiyaMineRefreshInFlight){window.__gudiyaMineRefreshPending=true;return;}
           window.__gudiyaMineRefreshInFlight=true;
           if(!silent)box.innerHTML='<div class="card empty">आपकी ड्यूटी लोड हो रही है…</div>';
           try{
            const [mine,accepted]=await Promise.all([apiRequest('/api/duties/mine'),apiRequest('/api/duties/accepted')]);
            const posted=(mine.duties||[]).map(d=>({...d,isOwner:(d.sourceType||d.source_type)!=='whatsapp',detailsAvailable:true,freeWindowSecondsRemaining:null}));
            const taken=(accepted.duties||[]).map(d=>({...d,detailsAvailable:true,acceptedByMe:true}));
            const all=[...posted,...taken];
            box.innerHTML=all.length?'<h3>आपकी पोस्ट की गई ड्यूटी</h3>'+ (posted.length?posted.map(d=>apiDutyCard(d)).join(''):'<div class="card empty">अभी आपने कोई ड्यूटी पोस्ट नहीं की।</div>')+'<h3>आपके द्वारा स्वीकार की गई ड्यूटी</h3>'+(taken.length?taken.map(d=>apiDutyCard(d)).join(''):'<div class="card empty">अभी आपने कोई ड्यूटी स्वीकार नहीं की।</div>'):'<div class="card empty">अभी कोई ड्यूटी पोस्ट या स्वीकार नहीं की गई है।</div>';
           }catch(e){
            const local=getLocalDuties();
            box.innerHTML=local.length?'<div class="warn">सर्वर उपलब्ध नहीं; फोन में सेव डेमो ड्यूटी दिखाई जा रही हैं।</div>'+local.map(d=>apiDutyCard({...d,detailsAvailable:true})).join(''):'<div class="warn">ड्यूटी लोड नहीं हुई: '+esc(e.message)+'</div>';
           }finally{
            window.__gudiyaMineRefreshInFlight=false;
            if(window.__gudiyaMineRefreshPending){
             window.__gudiyaMineRefreshPending=false;
             refreshVisibleDutyFeed();
            }
           }
          }
          function resetDutyForm"""
          content, mine_count = re.subn(mine_pattern, lambda match: mine_replacement, content, count=1)
          if mine_count != 1:
              raise SystemExit("My Duties function target missing; refusing to build.")

          # WhatsApp-imported duties must never expose the group title or raw group message.
          # Reuse the sanitizer already added above by the existing audit patch.
          old_owner_fields = "ownerName=cleanWhatsAppPosterName(d.posterName||d.poster_name||d.sourcePosterName||d.source_poster_name||'',d.sourceGroup||d.source_group||''),sourceGroup='',createdAt="
          new_owner_fields = "isWhatsApp=String(d.sourceType||d.source_type||'').toLowerCase()==='whatsapp',ownerName=cleanWhatsAppPosterName(d.posterName||d.poster_name||d.sourcePosterName||d.source_poster_name||'',d.sourceGroup||d.source_group||''),sourceGroup='',createdAt="
          if old_owner_fields not in content:
              raise SystemExit("Duty poster fields target missing; refusing to build.")
          content = content.replace(old_owner_fields, new_owner_fields, 1)

          display_start_marker = '${available?`<div class="notice duty-notes">'
          display_end_marker = ":'<div class=\"notice\">गैर-सदस्य के लिए पूरी जानकारी पहले 5 मिनट लॉक रहेगी। 5 मिनट बाद अपने-आप खुल जाएगी; सदस्य को पूरी जानकारी तुरंत दिखेगी।</div>'}"
          display_start = content.find(display_start_marker)
          display_end = content.find(display_end_marker, display_start)
          if display_start < 0 or display_end < 0:
              raise SystemExit("Duty card details display target missing; refusing to build.")
          display_end += len(display_end_marker)
          new_display = r"""${available?(isWhatsApp?`<div class="notice duty-poster">पोस्ट करने वाले: <b>${esc(ownerName||'नाम उपलब्ध नहीं')}</b> · ${esc(phone||'मोबाइल नंबर उपलब्ध नहीं')}</div>`:`<div class="notice duty-notes">जानकारी: ${esc(d.notes||d.notes_private||'—')}</div>${ownerName?`<div class="notice duty-poster">पोस्ट करने वाले: <b>${esc(ownerName)}</b> · ${esc(phone||'मोबाइल नंबर उपलब्ध नहीं')}</div>`:''}`):'<div class="notice">गैर-सदस्य के लिए पूरी जानकारी पहले 5 मिनट लॉक रहेगी। 5 मिनट बाद अपने-आप खुल जाएगी; सदस्य को पूरी जानकारी तुरंत दिखेगी।</div>'}"""
          content = content[:display_start] + new_display + content[display_end:]

          # The WhatsApp share action also must not copy the original group message.
          old_raw_note = "अन्य जानकारी: ${d.notes||d.notes_private||'—'}"
          new_raw_note = "अन्य जानकारी: ${String(d.sourceType||d.source_type||'').toLowerCase()==='whatsapp'?'—':(d.notes||d.notes_private||'—')}"
          if old_raw_note not in content:
              raise SystemExit("WhatsApp share message notes target missing; refusing to build.")
          content = content.replace(old_raw_note, new_raw_note, 1)

          html.write_text(content, encoding="utf-8")

          # Add only the Available Vehicles page and its fifth bottom-navigation item.
          old_nav = """<button data-page="account" onclick="show('account')"><span>👤</span>अकाउंट</button>"""
          new_nav = old_nav + """
           <button data-page="vehicles" aria-label="Available Vehicles" onclick="show('vehicles')"><span>🚘</span>गाड़ियाँ</button>"""
          if content.count(old_nav) != 1:
              raise SystemExit("Bottom navigation insertion point missing.")
          content = content.replace(old_nav, new_nav, 1)

          old_grid = "grid-template-columns:repeat(4,1fr)"
          if content.count(old_grid) != 1:
              raise SystemExit("Bottom navigation grid rule not found exactly once.")
          content = content.replace(old_grid, "grid-template-columns:repeat(5,minmax(0,1fr))", 1)

          page_anchor = """</main>\n<nav class="nav">"""
          if content.count(page_anchor) != 1:
              raise SystemExit("Main page insertion point not found exactly once.")
          vehicles_section = r"""  <section id="vehicles" class="hidden">
            <button class="back" onclick="show('home')">← होम पर जाएँ</button>
            <div class="headrow"><h2>Available Vehicles</h2><button class="btn outline" onclick="loadAvailableVehicles()">↻ Refresh</button></div>
            <div class="screen-intro">जब आपकी गाड़ी खाली हो, तो उसकी जानकारी यहाँ पोस्ट करें। दूसरे सदस्य उपलब्ध गाड़ियाँ देखकर आपसे संपर्क कर सकते हैं।</div>
            <div class="card">
              <h3>अपनी गाड़ी पोस्ट करें</h3>
              <div class="field"><label>🚘 गाड़ी का प्रकार *</label><input id="availableVehicleType" maxlength="80" placeholder="जैसे Sedan, SUV, Innova, Ertiga"></div>
              <div class="field"><label>गाड़ी का मॉडल</label><input id="availableVehicleModel" maxlength="120" placeholder="जैसे Innova Crysta 2022"></div>
              <div class="field"><label>रजिस्ट्रेशन नंबर</label><input id="availableVehicleReg" maxlength="24" placeholder="जैसे RJ14 AB 1234" autocapitalize="characters"></div>
              <div class="row">
                <div class="field"><label>📍 शहर *</label><input id="availableVehicleCity" maxlength="120" placeholder="जैसे जयपुर"></div>
                <div class="field"><label>सीटें</label><input id="availableVehicleSeats" type="number" min="1" max="50" value="4" inputmode="numeric"></div>
              </div>
              <div class="field"><label>कब से खाली है? *</label><input id="availableVehicleFrom" type="datetime-local" required></div>
              <div class="field"><label>कब तक खाली रहेगी? (वैकल्पिक)</label><input id="availableVehicleUntil" type="datetime-local"></div>
              <div class="field"><label>अन्य जानकारी (वैकल्पिक)</label><textarea id="availableVehicleNotes" maxlength="800" placeholder="जैसे AC, परमिट, सामान की जगह आदि"></textarea></div>
              <button class="btn teal" id="availableVehiclePostBtn" onclick="postAvailableVehicle()">＋ गाड़ी उपलब्ध पोस्ट करें</button>
              <div id="availableVehicleMessage" class="status-line" aria-live="polite"></div>
            </div>
            <div class="headrow"><h3>इस समय उपलब्ध गाड़ियाँ</h3></div>
            <div id="availableVehicleList"><div class="card empty">गाड़ियाँ लोड हो रही हैं…</div></div>
            <div class="headrow" style="margin-top:18px"><h3>मेरी पोस्ट की गई गाड़ियाँ</h3></div>
            <div id="myAvailableVehicleList"><div class="card empty">आपकी पोस्ट लोड हो रही हैं…</div></div>
          </section>
          """
          content = content.replace(page_anchor, vehicles_section + page_anchor, 1)

          old_pages = "const pages=['home','search','post','myduties','account','membership'];"
          new_pages = "const pages=['home','search','post','myduties','account','membership','vehicles'];"
          if content.count(old_pages) != 1:
              raise SystemExit("Page navigation list target missing exactly once.")
          content = content.replace(old_pages, new_pages, 1)

          old_show = "if(page==='search')renderSearch();if(page==='myduties')renderMine();if(page==='membership')refreshMembership();"
          new_show = "if(page==='search')renderSearch();if(page==='myduties')renderMine();if(page==='membership')refreshMembership();if(page==='vehicles'){setAvailableVehicleDateDefaults();loadAvailableVehicles();}"
          if content.count(old_show) != 1:
              raise SystemExit("Page navigation handler target missing exactly once.")
          content = content.replace(old_show, new_show, 1)

          vehicle_js = r"""
          function setAvailableVehicleDateDefaults(){
            const field=document.getElementById('availableVehicleFrom');
            if(field&&!field.value){
              const local=new Date(Date.now()-new Date().getTimezoneOffset()*60000);
              field.value=local.toISOString().slice(0,16);
            }
          }
          function availableVehicleDateTime(value){
            if(!value)return '—';
            const date=new Date(value);
            return Number.isNaN(date.getTime())?String(value):date.toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
          }
          function availableVehicleCard(v,isMine){
            const id=String(v.id||'').replace(/\D/g,'');
            const phone=String(v.owner_phone||'').replace(/\D/g,'').slice(-10);
            const type=esc(v.vehicle_type||'गाड़ी');
            const model=esc(v.vehicle_model||'');
            const reg=esc(v.registration_number||'नहीं दिया');
            const city=esc(v.city||'');
            const seats=esc(v.seats||'—');
            const from=availableVehicleDateTime(v.available_from);
            const until=v.available_until?availableVehicleDateTime(v.available_until):'जब तक unavailable न करें';
            const owner=esc(v.owner_name||'सदस्य');
            let actions='';
            if(isMine){
              const next=v.status==='available'?'unavailable':'available';
              const label=next==='available'?'फिर उपलब्ध करें':'Unavailable करें';
              actions='<div class="row" style="margin-top:10px"><button class="btn outline" onclick="setAvailableVehicleStatus('+id+',&#39;'+next+'&#39;)">'+label+'</button><button class="btn" onclick="removeAvailableVehicle('+id+')">पोस्ट हटाएँ</button></div>';
            }else if(phone){
              actions='<a class="btn outline" style="display:inline-block;margin-top:10px;text-decoration:none" href="tel:'+phone+'">📞 '+phone+' पर संपर्क करें</a>';
            }
            return '<article class="card" style="margin-bottom:10px"><div class="itemtop"><h3 style="margin:0">'+type+(model?' · '+model:'')+'</h3><span class="pill">'+(v.status==='available'?'उपलब्ध':'Unavailable')+'</span></div><p>📍 '+city+' · '+seats+' सीटें</p><p>नंबर: '+reg+'</p><p>मालिक: '+owner+'</p><p>उपलब्ध: '+esc(from)+' से</p><p>उपलब्धता: '+esc(until)+' तक</p>'+(v.notes?'<p>'+esc(v.notes)+'</p>':'')+actions+'</article>';
          }
          async function loadAvailableVehicles(){
            const list=document.getElementById('availableVehicleList');
            const mine=document.getElementById('myAvailableVehicleList');
            if(!list||!mine)return;
            if(!getToken()||!apiReady()){
              list.innerHTML='<div class="warn">उपलब्ध गाड़ियाँ देखने और पोस्ट करने के लिए पहले लॉगिन करें। <button class="btn outline" onclick="show(&#39;account&#39;)">लॉगिन करें</button></div>';
              mine.innerHTML='<div class="card empty">लॉगिन करने के बाद आपकी गाड़ी की पोस्ट यहाँ दिखेगी।</div>';
              return;
            }
            list.innerHTML='<div class="card empty">उपलब्ध गाड़ियाँ लोड हो रही हैं…</div>';
            mine.innerHTML='<div class="card empty">आपकी पोस्ट लोड हो रही हैं…</div>';
            try{
              const results=await Promise.all([
                apiRequest('/api/vehicles/available'),
                apiRequest('/api/vehicles/available/mine')
              ]);
              const vehicles=results[0].vehicles||[];
              const own=results[1].vehicles||[];
              list.innerHTML=vehicles.length?vehicles.map(v=>availableVehicleCard(v,false)).join(''):'<div class="card empty">अभी कोई गाड़ी उपलब्ध नहीं है।</div>';
              mine.innerHTML=own.length?own.map(v=>availableVehicleCard(v,true)).join(''):'<div class="card empty">आपने अभी कोई गाड़ी पोस्ट नहीं की है।</div>';
            }catch(error){
              list.innerHTML='<div class="warn">गाड़ियाँ लोड नहीं हुईं: '+esc(error.message)+'</div>';
              mine.innerHTML='<div class="card empty">आपकी पोस्ट अभी लोड नहीं हो सकीं।</div>';
            }
          }
          async function postAvailableVehicle(){
            const button=document.getElementById('availableVehiclePostBtn');
            const message=document.getElementById('availableVehicleMessage');
            if(!getToken()||!apiReady()){alert('गाड़ी पोस्ट करने के लिए पहले लॉगिन करें।');show('account');return;}
            const vehicleType=document.getElementById('availableVehicleType').value.trim();
            const vehicleModel=document.getElementById('availableVehicleModel').value.trim();
            const registrationNumber=document.getElementById('availableVehicleReg').value.trim();
            const city=document.getElementById('availableVehicleCity').value.trim();
            const seats=Number(document.getElementById('availableVehicleSeats').value||4);
            const from=document.getElementById('availableVehicleFrom').value;
            const until=document.getElementById('availableVehicleUntil').value;
            const notes=document.getElementById('availableVehicleNotes').value.trim();
            if(!vehicleType||!city||!from){alert('गाड़ी का प्रकार, शहर और उपलब्ध होने का समय भरें।');return;}
            if(!Number.isInteger(seats)||seats<1||seats>50){alert('सीटों की संख्या 1 से 50 के बीच लिखें।');return;}
            const availableFrom=new Date(from);
            const availableUntil=until?new Date(until):null;
            if(Number.isNaN(availableFrom.getTime())||(availableUntil&&Number.isNaN(availableUntil.getTime()))){alert('तारीख और समय सही चुनें।');return;}
            if(availableUntil&&availableUntil<=availableFrom){alert('उपलब्धता समाप्ति का समय, शुरू होने के समय के बाद होना चाहिए।');return;}
            const body={vehicleType,vehicleModel,registrationNumber,city,seats,availableFrom:availableFrom.toISOString(),availableUntil:availableUntil?availableUntil.toISOString():null,notes};
            button.disabled=true;
            button.textContent='गाड़ी पोस्ट हो रही है…';
            try{
              const result=await apiRequest('/api/vehicles/available',{method:'POST',body:JSON.stringify(body)});
              message.textContent=result.message||'गाड़ी उपलब्ध पोस्ट हो गई।';
              document.getElementById('availableVehicleModel').value='';
              document.getElementById('availableVehicleReg').value='';
              document.getElementById('availableVehicleNotes').value='';
              await loadAvailableVehicles();
            }catch(error){
              message.textContent='गाड़ी पोस्ट नहीं हुई: '+error.message;
            }finally{
              button.disabled=false;
              button.textContent='＋ गाड़ी उपलब्ध पोस्ट करें';
            }
          }
          async function setAvailableVehicleStatus(id,status){
            try{
              const result=await apiRequest('/api/vehicles/available/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({status})});
              alert(result.message||'गाड़ी की स्थिति अपडेट हो गई।');
              await loadAvailableVehicles();
            }catch(error){alert('स्थिति अपडेट नहीं हुई: '+error.message);}
          }
          async function removeAvailableVehicle(id){
            if(!confirm('क्या आप अपनी गाड़ी की यह पोस्ट हटाना चाहते हैं?'))return;
            try{
              const result=await apiRequest('/api/vehicles/available/'+encodeURIComponent(id),{method:'DELETE'});
              alert(result.message||'पोस्ट हटा दी गई।');
              await loadAvailableVehicles();
            }catch(error){alert('पोस्ट नहीं हटाई गई: '+error.message);}
          }
          """
          show_anchor = "function show(page){"
          if content.count(show_anchor) != 1:
              raise SystemExit("Page navigation function insertion point missing.")
          content = content.replace(show_anchor, vehicle_js + "\n" + show_anchor, 1)
          # Persist the final HTML after adding the fifth tab and vehicle page.
          html.write_text(content, encoding="utf-8")

          gradle = root / "app/build.gradle.kts"
          build = gradle.read_text(encoding="utf-8")
          build, c1 = re.subn(r"versionCode\s*=\s*\d+", "versionCode = 23", build, count=1)
          build, c2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.3.1"', build, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("Could not safely increment Android app version.")
          old_types = """    buildTypes {
        getByName("debug") {
            // Keep the same stable signing identity for every APK distributed from GitHub.
            signingConfig = signingConfigs.getByName("stableRelease")
        }
    }"""
          new_types = """    buildTypes {
        getByName("debug") {
            signingConfig = signingConfigs.getByName("stableRelease")
        }
        getByName("release") {
            signingConfig = signingConfigs.getByName("stableRelease")
            isMinifyEnabled = false
        }
    }"""
          if build.count(old_types) != 1:
              raise SystemExit("Stable User App signing block not found exactly once.")
          build = build.replace(old_types, new_types, 1)
          gradle.write_text(build, encoding="utf-8")
          PY
          # Fail the APK build if any inline WebView JavaScript is syntactically invalid.
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app-source/GudiyaTaxiPartner/app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.S|re.I)
          Path("/tmp/gudiya-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/gudiya-inline.js

      - name: Prepare stable signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing repository secret ANDROID_KEYSTORE_BASE64"; exit 1)
          mkdir -p app-source/GudiyaTaxiPartner/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app-source/GudiyaTaxiPartner/app/gudiya-release.jks
          test -s app-source/GudiyaTaxiPartner/app/gudiya-release.jks

      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app-source/GudiyaTaxiPartner/app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build APK with stable signing key
        working-directory: app-source/GudiyaTaxiPartner
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing repository secret ANDROID_KEYSTORE_PASSWORD"; exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing repository secret ANDROID_KEY_PASSWORD"; exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing repository secret ANDROID_KEY_ALIAS"; exit 1)
          gradle assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app-source/GudiyaTaxiPartner/app/build/outputs/apk/release/app-release.apk
          cp app-source/GudiyaTaxiPartner/app/build/outputs/apk/release/app-release.apk gudiya-taxi-partner.apk
          test -s gudiya-taxi-partner.apk

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT" || (echo "Missing aapt"; exit 1)
          test -n "$APKSIGNER" || (echo "Missing apksigner"; exit 1)
          BADGING="$("$AAPT" dump badging gudiya-taxi-partner.apk)"
          echo "$BADGING" | grep -F "package: name='com.gudiyataxipartner' versionCode='23' versionName='1.3.1'" >/dev/null || {
            echo "ERROR: User APK package/version metadata mismatch."
            echo "$BADGING" | head -5
            exit 1
          }
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "ERROR: Production User APK is still debuggable."
            exit 1
          fi
          "$APKSIGNER" verify gudiya-taxi-partner.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gudiya-taxi-partner-apk
          path: gudiya-taxi-partner.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Gudiya Taxi Partner APK
          body: |
            Latest Android APK for Gudiya Taxi Partner.
            Version: ${{ env.VERSION_NAME }}
            Download gudiya-taxi-partner.apk to install or update the app.
          target_commitish: main
          files: gudiya-taxi-partner.apk
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false
