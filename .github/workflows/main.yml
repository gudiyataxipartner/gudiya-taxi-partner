name: Gudiya Taxi Partner Android Build and APK Download

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract and validate source ZIP
        run: |
          set -e
          rm -rf extracted
          test -f Gudiya-Taxi-Partner-New-Project.zip
          unzip -o Gudiya-Taxi-Partner-New-Project.zip -d extracted
          test -f extracted/GudiyaTaxiPartner/settings.gradle.kts
          test -f extracted/GudiyaTaxiPartner/app/build.gradle.kts
          test -f extracted/GudiyaTaxiPartner/app/src/main/java/com/gudiyataxipartner/MainActivity.kt echo "Source ZIP validation passed" - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: extracted/GudiyaTaxiPartner
        run: gradle assembleDebug

      - name: Validate APK
        run: test -s extracted/GudiyaTaxiPartner/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for direct download
        run: cp extracted/GudiyaTaxiPartner/app/build/outputs/apk/debug/app-debug.apk Gudiya-Taxi-Partner.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gudiya-taxi-partner-debug-apk
          path: Gudiya-Taxi-Partner.apk
          if-no-files-found: error

      - name: Publish public APK download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Gudiya Taxi Partner Latest APK
          target_commitish: main
          make_latest: true
          overwrite_files: true
          files: Gudiya-Taxi-Partner.apk
