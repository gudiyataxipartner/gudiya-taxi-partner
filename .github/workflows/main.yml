
name: Gudiya Taxi Partner Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract new app source ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o Gudiya-Taxi-Partner-New-Project.zip -d extracted
          test -f extracted/app/build.gradle.kts
          test -f extracted/settings.gradle.kts

      - name: Fix Java and Kotlin targets
        run: |
          cat > extracted/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "in.gudiyataxipartner"
              compileSdk = 35

              defaultConfig {
                  applicationId = "in.gudiyataxipartner"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        working-directory: extracted
        run: gradle --no-daemon assembleDebug

      - name: Validate APK
        run: |
          test -s extracted/app/build/outputs/apk/debug/app-debug.apk
          echo "APK validation passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gudiya-taxi-partner-debug-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
