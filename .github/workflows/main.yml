name: Build and publish Gudiya Taxi Partner APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Gudiya-Taxi-Partner-New-Project.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and validate app source
        shell: bash
        run: |
          set -euo pipefail
          test -s Gudiya-Taxi-Partner-New-Project.zip
          rm -rf app-source
          unzip -oq Gudiya-Taxi-Partner-New-Project.zip -d app-source
          test -f app-source/GudiyaTaxiPartner/settings.gradle.kts
          test -f app-source/GudiyaTaxiPartner/app/build.gradle.kts
          test -f app-source/GudiyaTaxiPartner/app/src/main/assets/index.html

      - name: Prepare stable signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing repository secret ANDROID_KEYSTORE_BASE64"; exit 1)
          mkdir -p app-source/GudiyaTaxiPartner/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app-source/GudiyaTaxiPartner/app/gudiya-release.jks
          test -s app-source/GudiyaTaxiPartner/app/gudiya-release.jks

      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app-source/GudiyaTaxiPartner/app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build APK with stable signing key
        working-directory: app-source/GudiyaTaxiPartner
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing repository secret ANDROID_KEYSTORE_PASSWORD"; exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing repository secret ANDROID_KEY_PASSWORD"; exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing repository secret ANDROID_KEY_ALIAS"; exit 1)
          gradle assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app-source/GudiyaTaxiPartner/app/build/outputs/apk/debug/app-debug.apk
          cp app-source/GudiyaTaxiPartner/app/build/outputs/apk/debug/app-debug.apk gudiya-taxi-partner.apk
          test -s gudiya-taxi-partner.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gudiya-taxi-partner-apk
          path: gudiya-taxi-partner.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Gudiya Taxi Partner APK
          body: |
            Latest Android APK for Gudiya Taxi Partner.
            Version: ${{ env.VERSION_NAME }}
            Download gudiya-taxi-partner.apk to install or update the app.
          target_commitish: main
          files: gudiya-taxi-partner.apk
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false
