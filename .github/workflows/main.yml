name: Build and publish Gudiya Taxi Partner APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Gudiya-Taxi-Partner-New-Project.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and validate app source
        shell: bash
        run: |
          set -euo pipefail
          test -s Gudiya-Taxi-Partner-New-Project.zip
          rm -rf app-source
          unzip -oq Gudiya-Taxi-Partner-New-Project.zip -d app-source
          test -f app-source/GudiyaTaxiPartner/settings.gradle.kts
          test -f app-source/GudiyaTaxiPartner/app/build.gradle.kts
          test -f app-source/GudiyaTaxiPartner/app/src/main/assets/index.html

      - name: Fix WhatsApp duty contact display and bump app version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app-source/GudiyaTaxiPartner")
          html = root / "app/src/main/assets/index.html"
          content = html.read_text(encoding="utf-8")
          pattern = r"const contact=.*?;const share="
          replacement = r'''const contact=isOwner?`<div class="success duty-contact" style="margin-top:10px">✅ यह आपकी पोस्ट की गई ड्यूटी है। आप पर 5 मिनट का लॉक लागू नहीं है।</div>`:!available?`<div class="row duty-contact" style="margin-top:10px"><button class="btn teal" disabled>🔒 5 मिनट बाद कॉल</button><button class="btn" disabled>🔒 5 मिनट बाद WhatsApp</button></div>`:phone?`<div class="row duty-contact" style="margin-top:10px"><button class="btn teal" onclick="callPoster('${esc(id)}')">📞 कॉल करें</button><button class="btn" onclick="openPosterWhatsApp('${esc(id)}')">🟢 ड्यूटी की जानकारी WhatsApp करें</button></div>`:`<div class="notice duty-contact" style="margin-top:10px">✅ 5 मिनट पूरे हो चुके हैं, लेकिन इस ड्यूटी के संदेश में संपर्क मोबाइल नंबर उपलब्ध नहीं है।</div>`;const share='''
          content, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Duty contact UI patch target was not found; refusing to build.")
          html.write_text(content, encoding="utf-8")

          # Restore the missing Accept action and make it available only to
          # eligible driver accounts for open duties whose details are unlocked.
          fixes = [
              (
                  "canAccept=!!getToken()&&apiReady()&&d.status==='open'&&/^\\d+$/.test(id),phone=",
                  "canAccept=!!getToken()&&apiReady()&&['driver','both'].includes(currentUser?.roleMode||currentUser?.role_mode)&&!isOwner&&!d.acceptedByMe&&d.status==='open'&&available&&/^\\d+$/.test(id),phone=",
              ),
              (
                  ";const share=`<button class=\"btn outline\"",
                  ";const accept=canAccept?'<button class=\"btn teal\" style=\"margin-top:10px\" onclick=\"acceptDuty(\\''+esc(id)+'\\',this)\">✅ ड्यूटी स्वीकार करें</button>':'';const share=`<button class=\"btn outline\"",
              ),
              ("${contact}${share}", "${contact}${accept}${share}"),
              (
                  '<select id="qvehicle"><option value="">सभी गाड़ियाँ</option><option>सेडान</option><option>हैचबैक</option><option>एसयूवी</option><option>इनोवा / क्रिस्टा</option><option>टेम्पो ट्रैवलर</option><option>अन्य</option></select>',
                  '<select id="qvehicle"><option value="">सभी गाड़ियाँ</option><option value="sedan">सेडान</option><option value="hatchback">हैचबैक</option><option value="suv">एसयूवी</option><option value="innova">इनोवा / क्रिस्टा</option><option value="ertiga">Ertiga</option><option value="dzire">Dzire</option><option value="tempo">टेम्पो ट्रैवलर</option><option value="other">अन्य</option></select>',
              ),
              (
                  "function filterDutyResults(list){const date=document.getElementById('qdate')?.value||'',vehicle=document.getElementById('qvehicle')?.value||'';return list.filter(d=>{const dd=d.dutyDate||d.duty_date||'',vv=d.vehicleType||d.vehicle_type||'';return (!date||String(dd).slice(0,10)===date)&&(!vehicle||String(vv).toLowerCase()===vehicle.toLowerCase())})}",
                  "function filterDutyResults(list){const date=document.getElementById('qdate')?.value||'',vehicle=document.getElementById('qvehicle')?.value||'';const patterns={sedan:/(sedan|सेडान|dzire|swift)/i,hatchback:/(hatchback|हैचबैक)/i,suv:/(suv|एसयूवी|xylo|tavera|ertiga)/i,innova:/(innova|इनोवा)/i,ertiga:/(ertiga|अर्टिगा)/i,dzire:/(dzire|swift|डिजायर)/i,tempo:/(tempo|traveller|टेम्पो)/i,other:/^(अन्य|other)$/i};return list.filter(d=>{const dd=d.dutyDate||d.duty_date||'',vv=String(d.vehicleType||d.vehicle_type||'');return (!date||String(dd).slice(0,10)===date)&&(!vehicle||(patterns[vehicle]?patterns[vehicle].test(vv):true))})}",
              ),
              (
                  "const q=new URLSearchParams();if(from)q.set('pickup',from);if(to)q.set('drop',to);const data=await apiRequest('/api/duties?'+q.toString());",
                  "const q=new URLSearchParams();if(from)q.set('pickup',from);if(to)q.set('drop',to);const date=document.getElementById('qdate')?.value||'',vehicle=document.getElementById('qvehicle')?.value||'';if(date)q.set('date',date);if(vehicle)q.set('vehicle',vehicle);const data=await apiRequest('/api/duties?'+q.toString());",
              ),
              (
                  "}catch(serverError){if(editingDutyId){alert(serverError.message||'ड्यूटी अपडेट नहीं हो सकी।');return}saveLocalDuty(duty);resetDutyForm();alert('सर्वर से सेव नहीं हो पाई, इसलिए ड्यूटी इस फोन में डेमो के रूप में सेव कर दी गई है। इंटरनेट/सर्वर ठीक होने पर इसे दोबारा पोस्ट करें।');show('myduties');return}",
                  "}catch(serverError){alert((editingDutyId?'ड्यूटी अपडेट नहीं हो सकी: ':'ड्यूटी सर्वर पर पोस्ट नहीं हुई: ')+(serverError.message||'कृपया इंटरनेट/API जाँचकर फिर प्रयास करें।')+' आपके भरे हुए विवरण फॉर्म में सुरक्षित हैं।');return}",
              ),
              (r"""${sourceGroup?`<div class="notice">WhatsApp ग्रुप: <b>${esc(sourceGroup)}</b></div>`:''}""", "''"),
              ("<p style=\"margin:0 0 10px;line-height:1.5\">सदस्यता प्लान उपलब्ध हैं। भुगतान सुविधा पर अभी काम चल रहा है। नया भुगतान विकल्प शुरू होने तक कोई भुगतान नहीं होगा और सदस्यता अपने-आप सक्रिय नहीं होगी।</p>", "<p style=\"margin:0 0 10px;line-height:1.5\">सदस्यता का भुगतान BharatPe UPI से किया जा सकता है। प्लान चुनें, UPI ऐप में भुगतान करें और UTR / Transaction ID जमा करें। बैंक/UPI में रकम की पुष्टि और Admin approval के बाद ही सदस्यता सक्रिय होगी।</p>"),
              ("<div class=\"notice\" style=\"margin-top:10px\">भुगतान विकल्प जल्द उपलब्ध होगा।</div>", "<div class=\"notice\" style=\"margin-top:10px\">भुगतान जमा होने पर Admin BharatPe/UPI में रकम और UTR की पुष्टि करेगा।</div>"),
              ("let selectedUpiPlan=1;function startUpiPayment(months=1){if(!getToken())", "let selectedUpiPlan=1;function startUpiPayment(months=1){if(window.__gudiyaPaymentPending){alert('आपका भुगतान पहले से Admin के पास Pending है। कृपया सत्यापन पूरा होने तक दूसरा भुगतान न करें।');return}if(!getToken())"),
              ("document.getElementById('upiUtr').value='';}catch(e){box.className='warn';box.textContent='जमा नहीं हुआ: '+e.message;", "document.getElementById('upiUtr').value='';await refreshMembership();}catch(e){box.className='warn';box.textContent='जमा नहीं हुआ: '+e.message;"),
          ]
          for old, new in fixes:
              if old not in content:
                  raise SystemExit('User App audit fix target missing; refusing to build: ' + old[:100])
              content = content.replace(old, new, 1)

          # Replace only the membership status refresher, irrespective of minified whitespace.
          refresh_membership_function = r"""async function refreshMembership(){if(!getToken()||!apiReady())return;const box=document.getElementById('paymentMessage');try{const d=await apiRequest('/api/membership');if(!box)return;const request=d.paymentRequest||null;window.__gudiyaPaymentPending=request?.status==='pending';document.querySelectorAll('#membership .membership-option button').forEach(button=>{button.disabled=!!window.__gudiyaPaymentPending});if(request?.status==='pending'){document.getElementById('upiPaymentForm')?.classList.add('hidden');box.className='warn';box.textContent=(d.active?'आपकी वर्तमान सदस्यता सक्रिय है। ':'')+'आपका ₹'+request.amount_rupees+' का UPI भुगतान अनुरोध Pending है। Admin बैंक/UPI में UTR सत्यापित करेगा। पुष्टि होने तक दूसरा भुगतान न करें।';return;}if(d.active){box.className='success';box.textContent='आपकी '+(d.subscription?.amount_rupees||'चुनी गई')+' रुपये की सदस्यता सक्रिय है।';return;}if(request?.status==='rejected'){box.className='warn';box.textContent='पिछला UPI भुगतान अनुरोध अस्वीकार हुआ। '+(request.admin_note?'Admin note: '+request.admin_note:'कृपया UTR और भुगतान विवरण जाँचकर दोबारा प्रयास करें।');return;}box.className='warn';box.textContent='सदस्यता सक्रिय नहीं है। BharatPe UPI से प्लान चुनें और भुगतान के बाद UTR जमा करें।';}catch(e){if(box){box.className='warn';box.textContent='सदस्यता स्थिति लोड नहीं हुई: '+e.message}}}"""
          content, refresh_count = re.subn(
              r"async function refreshMembership\(\)\{[\s\S]*?\}(?=\s*\(function init\(\)\{)",
              lambda match: refresh_membership_function,
              content,
              count=1,
          )
          if refresh_count != 1:
              raise SystemExit("Membership status function not found exactly once; refusing to build.")
          if "window.__gudiyaPaymentPending" not in content or "भुगतान अनुरोध Pending है" not in content:
              raise SystemExit("Membership pending-payment status handler validation failed.")

          # Never show WhatsApp group metadata in a duty card. Normalize the
          # poster label because Android notification titles can arrive as
          # "Group name (7 messages): ~ Actual sender".
          old_owner = "ownerName=d.sourcePosterName||d.source_poster_name||d.posterName||d.poster_name||''"
          if old_owner not in content:
              raise SystemExit("Poster name rendering target missing; refusing to build.")
          clean_name = r"""function cleanWhatsAppPosterName(value,group){
           let name=String(value||'').trim();
           const groupName=String(group||'').trim();
           if(groupName&&name.toLowerCase().startsWith(groupName.toLowerCase()))name=name.slice(groupName.length).replace(/^\s*(?:\(\s*\d+\s+messages?\s*\))?\s*[:：\-–]\s*/i,'');
           name=name.replace(/^.*?\(\s*\d+\s+messages?\s*\)\s*[:：]\s*/i,'').replace(/^~\s*/,'').split(/\r?\n/)[0].replace(/\s*[·|]\s*\+?\d[\d\s-]{8,}\s*$/,'').trim();
           if(/^\d+\s+messages?$/i.test(name)||/^whatsapp\s*$/i.test(name))return '';
           return name;
          }
          """
          content = content.replace(old_owner, "ownerName=cleanWhatsAppPosterName(d.posterName||d.poster_name||d.sourcePosterName||d.source_poster_name||'',d.sourceGroup||d.source_group||'')", 1)
          card_anchor = "function apiDutyCard(d){"
          if card_anchor not in content:
              raise SystemExit("Duty card insertion point missing for WhatsApp name sanitizer.")
          content = content.replace(card_anchor, clean_name + "\n" + card_anchor, 1)
          # Suppress source-group label even if a future card template adds it.
          group_block = r"\$\{sourceGroup\?`<div class=\"notice\">WhatsApp ग्रुप:[\s\S]*?</div>`:''\}"
          content = re.sub(group_block, "", content, count=1)
          content = content.replace("sourceGroup=d.sourceGroup||d.source_group||'',", "sourceGroup='',", 1)

          # Format any raw ISO timestamp as Indian local date/time.
          card_anchor = "function apiDutyCard(d){"
          formatter = "function formatDutyPostedAt(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return String(value||'');return new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(date)}" + "\n"
          if card_anchor not in content:
              raise SystemExit("Duty card insertion point missing; refusing to build.")
          content = content.replace(card_anchor, formatter + card_anchor, 1)
          old_posted = "${esc(d.createdAt||d.created_at||'')}"
          if old_posted not in content:
              raise SystemExit("Duty posted-at display target missing; refusing to build.")
          content = content.replace(old_posted, "${esc(formatDutyPostedAt(d.createdAt||d.created_at||''))}", 1)

          html.write_text(content, encoding="utf-8")
          # Duty refresh: ignore SSE connection handshakes and refresh only on real duty changes.
          old_sse_handler = "if(event.includes('event: duty-update'))refreshVisibleDutyFeed();"
          new_sse_handler = r"""const eventName=(event.match(/^event:\s*(.+)$/m)||[])[1]||'';
              const dataText=event.split(/\r?\n/).filter(line=>line.startsWith('data:')).map(line=>line.slice(5).trim()).join('\n');
              if(eventName==='duty-update'&&dataText){try{const payload=JSON.parse(dataText);if(payload&&payload.type==='duties-changed')refreshVisibleDutyFeed();}catch(e){}}"""
          if old_sse_handler not in content:
              raise SystemExit("Duty SSE handler target missing; refusing to build.")
          content = content.replace(old_sse_handler, new_sse_handler, 1)

          # Coalesce focus/visibility/SSE callbacks; automatic list refreshes are
          # limited to one every 5 seconds and only while the relevant screen is visible.
          refresh_pattern = r"function refreshVisibleDutyFeed\(\)\{[\s\S]*?\n\}"
          refresh_replacement = r"""function refreshVisibleDutyFeed(){
           if(document.hidden||!getToken()||!apiReady())return;
           const search=document.getElementById('search');
           const mine=document.getElementById('myduties');
           if((!search||search.classList.contains('hidden'))&&(!mine||mine.classList.contains('hidden')))return;
           if(window.__gudiyaDutyFeedRefreshTimer)clearTimeout(window.__gudiyaDutyFeedRefreshTimer);
           const elapsed=Date.now()-(window.__gudiyaLastDutyFeedRefresh||0);
           const wait=Math.max(400,5000-elapsed);
           window.__gudiyaDutyFeedRefreshTimer=setTimeout(()=>{
            window.__gudiyaDutyFeedRefreshTimer=null;
            if(document.hidden||!getToken()||!apiReady())return;
            const currentSearch=document.getElementById('search');
            const currentMine=document.getElementById('myduties');
            if(currentSearch&&!currentSearch.classList.contains('hidden')){
             window.__gudiyaLastDutyFeedRefresh=Date.now();
             renderSearch(true);
            }else if(currentMine&&!currentMine.classList.contains('hidden')){
             window.__gudiyaLastDutyFeedRefresh=Date.now();
             renderMine(true);
            }
           },wait);
          }"""
          content, refresh_count = re.subn(refresh_pattern, lambda match: refresh_replacement, content, count=1)
          if refresh_count != 1:
              raise SystemExit("Duty refresh function target missing; refusing to build.")

          # Quiet background refreshes so the existing My Duties list remains on-screen.
          # Prevent overlapping requests and run one coalesced follow-up when needed.
          mine_pattern = r"async function renderMine\(\)\{[\s\S]*?\}\nfunction resetDutyForm"
          mine_replacement = r"""async function renderMine(silent=false){
           const box=document.getElementById('myDutyList');
           if(!getToken()||!apiReady()){
            const local=getLocalDuties();
            box.innerHTML=local.length?local.map(d=>apiDutyCard({...d,isOwner:true,detailsAvailable:true,freeWindowSecondsRemaining:null})).join(''):'<div class="card empty">इस फोन पर अभी कोई ड्यूटी सेव नहीं है।</div>';
            return;
           }
           if(window.__gudiyaMineRefreshInFlight){window.__gudiyaMineRefreshPending=true;return;}
           window.__gudiyaMineRefreshInFlight=true;
           if(!silent)box.innerHTML='<div class="card empty">आपकी ड्यूटी लोड हो रही है…</div>';
           try{
            const [mine,accepted]=await Promise.all([apiRequest('/api/duties/mine'),apiRequest('/api/duties/accepted')]);
            const posted=(mine.duties||[]).map(d=>({...d,isOwner:(d.sourceType||d.source_type)!=='whatsapp',detailsAvailable:true,freeWindowSecondsRemaining:null}));
            const taken=(accepted.duties||[]).map(d=>({...d,detailsAvailable:true,acceptedByMe:true}));
            const isBooked=d=>String(d.status||'').trim().toLowerCase()==='booked';
            const bookedById=new Map();
            [...posted,...taken].filter(isBooked).forEach(d=>bookedById.set(String(d.id),d));
            const booked=[...bookedById.values()];
            const activePosted=posted.filter(d=>!isBooked(d));
            const activeTaken=taken.filter(d=>!isBooked(d));
            const hasAny=booked.length||activePosted.length||activeTaken.length;
            box.innerHTML=hasAny?
             '<h3>✅ Booked ड्यूटी</h3>'+(booked.length?booked.map(d=>apiDutyCard(d)).join(''):'<div class="card empty">अभी कोई ड्यूटी Booked नहीं हुई है।</div>')+
             '<h3>आपकी पोस्ट की गई ड्यूटी</h3>'+(activePosted.length?activePosted.map(d=>apiDutyCard(d)).join(''):'<div class="card empty">अभी कोई सक्रिय पोस्ट की गई ड्यूटी नहीं है।</div>')+
             '<h3>आपके द्वारा स्वीकार की गई ड्यूटी</h3>'+(activeTaken.length?activeTaken.map(d=>apiDutyCard(d)).join(''):'<div class="card empty">अभी कोई सक्रिय स्वीकार की गई ड्यूटी नहीं है।</div>')
             :'<div class="card empty">अभी कोई ड्यूटी पोस्ट या स्वीकार नहीं की गई है।</div>';
           }catch(e){
            const local=getLocalDuties();
            box.innerHTML=local.length?'<div class="warn">सर्वर उपलब्ध नहीं; फोन में सेव डेमो ड्यूटी दिखाई जा रही हैं।</div>'+local.map(d=>apiDutyCard({...d,detailsAvailable:true})).join(''):'<div class="warn">ड्यूटी लोड नहीं हुई: '+esc(e.message)+'</div>';
           }finally{
            window.__gudiyaMineRefreshInFlight=false;
            if(window.__gudiyaMineRefreshPending){
             window.__gudiyaMineRefreshPending=false;
             refreshVisibleDutyFeed();
            }
           }
          }
          function resetDutyForm"""
          content, mine_count = re.subn(mine_pattern, lambda match: mine_replacement, content, count=1)
          if mine_count != 1:
              raise SystemExit("My Duties function target missing; refusing to build.")

          if "✅ Booked ड्यूटी" not in content or "const bookedById=new Map()" not in content:
              raise SystemExit("Booked duties grouping was not applied; refusing to build.")
          if "const activePosted=posted.filter(d=>!isBooked(d));" not in content or "const activeTaken=taken.filter(d=>!isBooked(d));" not in content:
              raise SystemExit("Active duty grouping validation failed; refusing to build.")

          # WhatsApp-imported duties must never expose the group title or raw group message.
          # Reuse the sanitizer already added above by the existing audit patch.
          old_owner_fields = "ownerName=cleanWhatsAppPosterName(d.posterName||d.poster_name||d.sourcePosterName||d.source_poster_name||'',d.sourceGroup||d.source_group||''),sourceGroup='',createdAt="
          new_owner_fields = "isWhatsApp=String(d.sourceType||d.source_type||'').toLowerCase()==='whatsapp',ownerName=cleanWhatsAppPosterName(d.posterName||d.poster_name||d.sourcePosterName||d.source_poster_name||'',d.sourceGroup||d.source_group||''),sourceGroup='',createdAt="
          if old_owner_fields not in content:
              raise SystemExit("Duty poster fields target missing; refusing to build.")
          content = content.replace(old_owner_fields, new_owner_fields, 1)

          display_start_marker = '${available?`<div class="notice duty-notes">'
          display_end_marker = ":'<div class=\"notice\">गैर-सदस्य के लिए पूरी जानकारी पहले 5 मिनट लॉक रहेगी। 5 मिनट बाद अपने-आप खुल जाएगी; सदस्य को पूरी जानकारी तुरंत दिखेगी।</div>'}"
          display_start = content.find(display_start_marker)
          display_end = content.find(display_end_marker, display_start)
          if display_start < 0 or display_end < 0:
              raise SystemExit("Duty card details display target missing; refusing to build.")
          display_end += len(display_end_marker)
